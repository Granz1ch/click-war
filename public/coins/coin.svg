<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="face" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ffe9a0"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
    </linearGradient>
  </defs>

  <g filter="url(#glow)">
    <ellipse cx="256" cy="300" rx="180" ry="60" fill="rgba(120,60,0,0.35)"/>
    <circle cx="256" cy="256" r="230" fill="url(#rim)"/>
    <circle cx="256" cy="256" r="200" fill="url(#face)"/>
    <circle cx="256" cy="256" r="168" fill="none" stroke="#b45309" stroke-width="10" stroke-opacity="0.5"/>
    <!-- star emoji-ish glyph -->
    <g transform="translate(-64,-64)">
      <path d="M320 64 L392 240 L576 256 L448 368 L500 544 L320 464 L140 544 L192 368 L64 256 L248 240 Z"
            fill="#b45309"/>
      <path d="M320 120 L378 262 L520 272 L424 356 L462 488 L320 424 L178 488 L216 356 L120 272 L262 262 Z"
            fill="#fffbeb"/>
    </g>
    <!-- shine -->
    <ellipse cx="160" cy="150" rx="120" ry="80" fill="url(#shine)" opacity="0.55"/>
  </g>
</svg>
